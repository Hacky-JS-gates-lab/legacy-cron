# The same review with anthropics/claude-code-action v1. Copy to .github/workflows/ai-review.yml
# and copy ai-review/ to .github/ai-review/. Needs the org allowlist pattern
# "anthropics/claude-code-action@*" (and "oven-sh/setup-bun@*", which the action calls) when
# allowed_actions is "selected". The verdict is advisory. Never make it a required check.
name: ai-review-action
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ran: ${{ steps.render.outputs.ran }}
    steps:
      - id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "has=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != true ]; then
            echo "::notice::No ANTHROPIC_API_KEY in this run (fork PR, Dependabot PR, or not configured). AI review skipped."
          fi
      - if: steps.key.outputs.has == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: prep
        if: steps.key.outputs.has == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr.diff"
          git show "$BASE_SHA:.github/ai-review/prompt.md" > "$RUNNER_TEMP/prompt.md"
          git show "$BASE_SHA:.github/ai-review/render.jq" > "$RUNNER_TEMP/render.jq"
          { echo 'schema<<EOS'; git show "$BASE_SHA:.github/ai-review/schema.json"; echo EOS; } >> "$GITHUB_OUTPUT"
      - id: claude
        if: steps.key.outputs.has == 'true'
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          restrict_untrusted_prs: "true"
          prompt: |
            Read the review instructions in ${{ runner.temp }}/prompt.md and follow them.
            The pull request diff is in ${{ runner.temp }}/pr.diff.
          claude_args: >-
            --model haiku --max-turns 8
            --permission-mode default
            --allowedTools Read,Grep,Glob
            --disallowedTools Bash,Edit,Write,WebFetch,WebSearch
            --add-dir ${{ runner.temp }}
            --json-schema '${{ steps.prep.outputs.schema }}'
      - id: render
        if: steps.claude.outputs.structured_output != ''
        env:
          REVIEW: ${{ steps.claude.outputs.structured_output }}
        run: |
          printf '%s' "$REVIEW" | jq -r -f "$RUNNER_TEMP/render.jq" > review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - if: steps.render.outputs.ran == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review
          path: review.md
          retention-days: 7

  post:
    needs: review
    if: needs.review.outputs.ran == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr comment "$PR" -R "$REPO" --body-file review.md --edit-last --create-if-none
