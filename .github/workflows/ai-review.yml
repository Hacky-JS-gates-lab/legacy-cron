# AI review with plain `claude -p` (no third-party action). Copy to .github/workflows/ai-review.yml
# and copy ai-review/ to .github/ai-review/.
# Job 1 (review) holds the model key and can only READ: no PR write, no Bash for the model.
# Job 2 (post) can comment but has no key, no checkout and never runs PR code.
# The verdict is advisory. Never make "ai-review" a required check.
name: ai-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.run.outputs.ran }}
    steps:
      - id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "has=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != true ]; then
            echo "::notice::No ANTHROPIC_API_KEY in this run (fork PR, Dependabot PR, or not configured). AI review skipped."
          fi
      - if: steps.key.outputs.has == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: steps.key.outputs.has == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: run
        if: steps.key.outputs.has == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Install outside the checkout so the PR's .npmrc doesn't apply.
          (cd "$RUNNER_TEMP" && npm install -g @anthropic-ai/claude-code@2.1.323)
          git diff "$BASE_SHA"...HEAD > "$RUNNER_TEMP/pr.diff"
          # --tools: the model gets only Read, Grep and Glob (no Bash, Edit, Write, WebFetch).
          # Prompt and schema come from the BASE commit, so the PR can't rewrite them for this run.
          git show "$BASE_SHA:.github/ai-review/prompt.md" > "$RUNNER_TEMP/prompt.md"
          git show "$BASE_SHA:.github/ai-review/schema.json" > "$RUNNER_TEMP/schema.json"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model haiku --max-budget-usd 0.50 --max-turns 8 \
            --tools Read,Grep,Glob --permission-mode default \
            --output-format json --json-schema "$(cat "$RUNNER_TEMP/schema.json")" \
            < "$RUNNER_TEMP/pr.diff" > "$RUNNER_TEMP/out.json"
          jq '.structured_output' "$RUNNER_TEMP/out.json" > review.json
          git show "$BASE_SHA:.github/ai-review/render.jq" > "$RUNNER_TEMP/render.jq"
          jq -r -f "$RUNNER_TEMP/render.jq" review.json > review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - if: steps.run.outputs.ran == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review
          path: review.md
          retention-days: 7

  post:
    needs: review
    if: needs.review.outputs.ran == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # The body is model output: pass it as a file, never through ${{ }} or the shell.
        run: gh pr comment "$PR" -R "$REPO" --body-file review.md --edit-last --create-if-none
